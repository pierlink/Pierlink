# 依赖许可证白名单：只允许宽松许可证（不传染），本项目自身用 FSL-1.1-ALv2，以后可能有商业版
[graph]
all-features = true

[licenses]
confidence-threshold = 0.9
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "0BSD",
  "BSL-1.0",
  "CC0-1.0",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "MPL-2.0",
  "CDLA-Permissive-2.0",
]
# 本项目自身的包不检查（不发布到 crates.io）
private = { ignore = true }

[bans]
multiple-versions = "allow"

[advisories]
ignore = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
