[package]
name = "pierlink-ssh-engine"
description = "Pierlink 内置 SSH 引擎（基于 russh）"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# 仅供 core 的协议测试使用，生产依赖不启用。
test-support = []

[dependencies]
russh = "=0.64.1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros", "fs"] }
thiserror.workspace = true
serde.workspace = true
tempfile.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[dev-dependencies]
tempfile.workspace = true
