[workspace]
members = ["src-tauri", "crates/core", "crates/ssh-engine", "tools/export-bindings"]
# 带补丁的 russh 只作为依赖使用，不算本 workspace 的成员（不跟着格式化和静态检查）
exclude = ["vendor"]
resolver = "3"

[workspace.package]
version = "0.9.7"
edition = "2024"
license = "FSL-1.1-ALv2"
publish = false

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0.21"
specta = { version = "=2.0.0-rc.26", features = ["derive"] }
specta-typescript = "=0.0.13"
tauri-specta = { version = "=2.0.0-rc.26", features = ["derive", "typescript"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
rusqlite_migration = "2.6.0"
uuid = { version = "1.28.0", features = ["v4"] }
rand = "0.10.3"
regex = "1.13.1"
tempfile = "3.27.0"
keyring-core = "1"
windows-native-keyring-store = "1"
portable-pty = "0.9.0"
windows-sys = { version = "0.61", features = ["Win32_System_JobObjects", "Win32_Foundation", "Win32_System_Threading", "Win32_Security"] }
libc = "0.2"
ureq = { version = "3.5.0", default-features = false, features = ["json", "socks-proxy", "rustls-no-provider", "_ring", "platform-verifier"] }
sha2 = "0.10.9"
quick-xml = "0.42.0"

# 开发构建：只留行号（出错时的回溯够用），依赖不带调试信息，编译产物小一半以上（数据盘紧张）
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
codegen-units = 1
lto = true
strip = true

# russh 打了补丁（单个通道不读、发送积压时不卡住整条连接），源码在 vendor/russh，改动见其中的 PIERLINK-CHANGES.md
[patch.crates-io]
russh = { path = "vendor/russh" }
# ssh-key 打了补丁（开头是 0 的 ECDSA 私钥读不出来），源码在 vendor/ssh-key，改动见其中的 PIERLINK-CHANGES.md
ssh-key = { path = "vendor/ssh-key" }
